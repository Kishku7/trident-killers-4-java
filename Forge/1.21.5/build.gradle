// Trident Killers 4 Java - Forge cell, MC 1.21.5 (single-cross-version-source / Cog model).
// Forge 1.20.6+ runs official mojmaps at runtime; FG6 skips reobf so no refmap is consulted.
// Compiles the Cog-generated shared_minecraft output (gen/), NOT shared_minecraft directly.
// JDK 21. -Xlint:all + zero warnings.

plugins {
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = '1.2.13+1.21.5-forge'
group = 'com.kishku7'
base { archivesName = 'trident-killers-4-java' }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// Cog-generated shared_minecraft source + resources (produced by cog-gen.ps1 for this MC version).
sourceSets.main.java.srcDir 'gen/src/main/java'
sourceSets.main.resources.srcDir 'gen/src/main/resources'

minecraft {
    mappings channel: 'official', version: '1.21.5'
    copyIdeResources = true
}

mixin {
    add sourceSets.main, 'trident_killers_4_java.refmap.json'
    config 'trident_killers_4_java.mixins.json'
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.21.5-55.1.10'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:all', '-Xlint:-processing']  // -processing: @Mod (Forge) + @Unique (mixin) are loader/runtime annotations no AP claims; the note is benign
}

// Forge 1.20.6+ runs mojmap at runtime; FG6 skips reobf so the mixin plugin's
// manifest wiring does nothing - the MixinConfigs attribute must be explicit.
// D12: FML resolves mods.toml's ${file.jarVersion} from the jar manifest's Implementation-Version.
// Without it the mod reports "0.0NONE" in the mod list and in every log line (caught 2026-08-01).
// The loader suffix is a FILENAME convention, not part of the mod version, so it is stripped here.
def displayVersion = project.version.toString().replaceAll(/-(forge|neoforge)$/, '')
jar {
    manifest {
        attributes([
            'MixinConfigs'          : 'trident_killers_4_java.mixins.json',
            'Implementation-Title'  : 'Trident Killers 4 Java',
            'Implementation-Version': displayVersion,
            'Implementation-Vendor' : 'Kishku7'
        ])
    }
}
