// Trident Killers 4 Java - NeoForge cell, MC 1.20.1 (single-cross-version-source / Cog model).
// NeoForge 1.20.1 (47.x) is a Forge 1.20.1 fork: SRG-named at runtime. Built with ForgeGradle 6
// + the SpongePowered mixin plugin so the annotation processor GENERATES a Mojmap->SRG refmap
// (trident_killers_4_java.refmap.json) and the jar manifest gets the MixinConfigs attribute.
// Compiles the Cog-generated shared_minecraft output (gen/), NOT shared_minecraft directly.
// JDK 17 (Forge 47 bundles Mixin 0.8.5 -> JAVA_17). -Xlint:all + zero warnings.

plugins {
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = '1.2.6+1.20.1-neoforge'
group = 'com.kishku7'
base { archivesName = 'trident-killers-4-java' }

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

repositories {
    maven { url = 'https://maven.neoforged.net/releases' }
}

// Cog-generated shared_minecraft source + resources (produced by cog-gen.ps1 for this MC version).
sourceSets.main.java.srcDir 'gen/src/main/java'
sourceSets.main.resources.srcDir 'gen/src/main/resources'

// Target the neoforged 'forge' artifact so deps/ATs line up with the NeoForge 1.20.1 server.
minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true
}

mixin {
    add sourceSets.main, 'trident_killers_4_java.refmap.json'
    config 'trident_killers_4_java.mixins.json'
}

dependencies {
    minecraft 'net.neoforged:forge:1.20.1-47.1.106'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:all']
}
