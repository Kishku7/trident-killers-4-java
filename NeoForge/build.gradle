plugins {
    id 'eclipse'
    id 'net.neoforged.moddev' version '2.0.141'
}

repositories {
    mavenLocal()
    maven { url = 'https://maven.neoforged.net/releases' }
    mavenCentral()
}

version = "${mod_version}+${minecraft_version}-neoforge"
group = 'com.kishku7'
base { archivesName = 'trident-killers-4-java' }

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// Shared MC-coupled core + mixins (single source of truth).
sourceSets.main.java.srcDir "../shared_minecraft/src/main/java"
sourceSets.main.resources.srcDir "../shared_minecraft/src/main/resources"

neoForge {
    version = project.neo_version
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

processResources {
    inputs.property('mcRange', project.mc_range)
    inputs.property('neoforgeRange', project.neoforge_range)
    filesMatching('META-INF/neoforge.mods.toml') {
        filter { line -> line.replace('${mcRange}', project.mc_range).replace('${neoforgeRange}', project.neoforge_range) }
    }
}
