plugins {
    id 'eclipse'
    id 'net.neoforged.moddev' version '2.0.141'
}

repositories {
    mavenLocal()
    maven { url = 'https://maven.neoforged.net/releases' }
    mavenCentral()
}

version = "${mod_version}+${minecraft_version}-neoforge"
group = 'com.kishku7'
base { archivesName = 'trident-killers-4-java' }

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// Cog-generated single-source output (produced by scripts/cog-gen.ps1 for this 26.x target):
// shared_minecraft (the 26 master) copied into gen/ then overlaid with the cog_sources drift
// files -- cog_sources is the SOLE source of ThrownTridentMixin/TridentKillerLogic. The 26 cog
// output reproduces the 26 master byte-for-byte, so the built jar is unchanged. build-*.ps1
// runs cog-gen before gradlew; a manual gradlew build needs cog-gen run first.
sourceSets.main.java.srcDir "gen/src/main/java"
sourceSets.main.resources.srcDir "gen/src/main/resources"

neoForge {
    version = project.neo_version
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.compilerArgs += ['-Xlint:all'] }

processResources {
    // 26.x resource pack_format > 81 -> range-form min/max REQUIRED (26.1=84, 26.2=88, 26.3=91).
    def packFormat = (project.findProperty("pack_format") ?: System.getenv("PACK_FORMAT") ?: "88")
    def ep = [mod_version: mod_version, mcRange: project.mc_range, neoforgeRange: project.neoforge_range]
    inputs.properties(ep + [packFormat: packFormat])
    filesMatching('META-INF/neoforge.mods.toml') { expand(ep) }
    filesMatching('pack.mcmeta') { expand(packFormat: packFormat) }
}
