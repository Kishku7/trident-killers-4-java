// Trident Killers 4 Java - NeoForge cell, MC 1.20.4 (single-cross-version-source / Cog model).
// Pre-rename NeoGradle userdev (ModDevGradle cannot consume NeoForge < 20.5). Covers the
// 1.20.2-1.20.4 gap. Legacy META-INF/mods.toml + mixin config declared via the JAR manifest
// MixinConfigs attribute (the toml [[mixins]] block is a 20.5+ feature).
// Compiles the Cog-generated shared_minecraft output (gen/), NOT shared_minecraft directly.
// JDK 17. -Xlint:all + zero warnings.

plugins {
    id 'eclipse'
    id 'net.neoforged.gradle.userdev' version '7.0.192'
}

version = '1.2.9+1.20.4-neoforge'
group = 'com.kishku7'
base { archivesName = 'trident-killers-4-java' }

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

// Cog-generated shared_minecraft source + resources (produced by cog-gen.ps1 for this MC version).
sourceSets.main.java.srcDir 'gen/src/main/java'
sourceSets.main.resources.srcDir 'gen/src/main/resources'

dependencies {
    implementation 'net.neoforged:neoforge:20.4.237'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
    options.compilerArgs += ['-Xlint:all']
}

// NeoForge 20.4 (MC 1.20.2-1.20.4) is pre-rename: it uses legacy META-INF/mods.toml
// and reads mixin configs from the JAR manifest MixinConfigs attribute, NOT a toml
// [[mixins]] block (that block is a 20.5+ feature). Declare the config here.
jar {
    manifest {
        attributes([
            'MixinConfigs': 'trident_killers_4_java.mixins.json'
        ])
    }
}
